name: hairhub

services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=hairhub'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=hairhub_user'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hairhub_user -d hairhub" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hairhub'
      - 'SPRING_DATASOURCE_USERNAME=hairhub_user'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: